version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/logs:/app/logs
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5000:5000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001/api
      - REACT_APP_WS_URL=http://localhost:5001
      - PORT=5000
    depends_on:
      - backend
    restart: unless-stopped
